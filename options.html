<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<title>AutoScroller オプション</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body class="cw-options-body">
	<div class="options-container">
		<h2>AutoScroller オプション</h2>
		<form id="options-form">
			<div class="row">
				<label for="default-speed">デフォルト再生速度（倍率）</label>
				<input type="number" id="default-speed" min="0.5" max="3" step="0.05" value="1">
			</div>
			<button type="submit">保存</button>
		</form>
		<p id="options-status" class="options-status" role="status"></p>
	</div>
	<script src="options.js"></script>
</body>
</html>
